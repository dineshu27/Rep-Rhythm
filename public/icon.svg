 <radialGradient id="glow" cx=".2" cy=".1" r="1"><stop stop-color="#d99dff" stop-opacity=".22"/><stop offset="1" stop-color="#a361f0" stop-opacity="0"/></radialGradient>
 <linearGradient id="letter" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fffaff"/><stop offset=".6" stop-color="#eedcff"/><stop offset="1" stop-color="#bc88ef"/></linearGradient>
 <linearGradient id="energy" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ab63f3"/><stop offset="1" stop-color="#e2b9ff"/></linearGradient>
